services:
  vibe-trading:
    build:
      context: .
      args:
        VITE_BROWSER_API_URL: ${VITE_BROWSER_API_URL:-https://guangyingzhimeng.dpdns.org}
        VITE_BROWSER_API_PREFIX: ${VITE_BROWSER_API_PREFIX:-/vibe-trading}
    ports:
      - "8899:8899"
    networks:
      - way
    env_file:
      - agent/.env
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - vibe-user-data:/app/agent/user_data
      - vibe-uploads:/app/agent/uploads
      - vibe-swarm:/app/agent/.swarm
    environment:
      - MONGO_URI=mongodb://trading:vibe-trading@mongo:27017/vibe_trading?authSource=admin
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: docker.1ms.run/mongo:latest
    container_name: mongo
    networks:
      - way
    restart: always
    ports:
      - 27017:27017
    command: mongod --keyFile /data/mongodb.key --replSet rs0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=trading
      - MONGO_INITDB_ROOT_PASSWORD=vibe-trading
    volumes:
      - vibe-mongo:/data/db
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 128 > /data/mongodb.key
        chmod 400 /data/mongodb.key
        chown 999:999 /data/mongodb.key

        cat > /data/initReplicaSet.js <<'EOF'
        let isInited = false;

        try {
          isInited = rs.status().ok === 1;
        } catch (e) {
          isInited = false;
        }

        if (!isInited) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo:27017" }
            ]
          });
        }
        EOF

        exec docker-entrypoint.sh "$$@" &

        CLIENT="mongosh"
        command -v mongosh >/dev/null 2>&1 || CLIENT="mongo"

        echo "Waiting for MongoDB to start and authenticating..."
        until $$CLIENT -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })"; do
          sleep 2
        done

        echo "Authentication successful, initializing replica set..."
        $$CLIENT -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin /data/initReplicaSet.js

        echo "Replica set initialized!"
        wait $$!

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    env_file:
      - agent/.env
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-user-data:
  vibe-uploads:
  vibe-swarm:
  vibe-mongo:

networks:
  way:
    external: true