services:
  vibe-trading:
    build:
      context: .
      args:
        VITE_BROWSER_API_URL: ${VITE_BROWSER_API_URL:-https://guangyingzhimeng.dpdns.org}
        VITE_BROWSER_API_PREFIX: ${VITE_BROWSER_API_PREFIX:-/vibe-trading}
    ports:
      - "8899:8899"
    env_file:
      - agent/.env
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - vibe-user-data:/app/agent/user_data
      - vibe-uploads:/app/agent/uploads
      - vibe-swarm:/app/agent/.swarm
    environment:
      - MONGO_URI=mongodb://trading:vibe-trading@mongo:27017/vibe_trading?authSource=admin
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=trading
      - MONGO_INITDB_ROOT_PASSWORD=vibe-trading
    volumes:
      - vibe-mongo:/data/db
    restart: unless-stopped

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    env_file:
      - agent/.env
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-user-data:
  vibe-uploads:
  vibe-swarm:
  vibe-mongo:
