services:
  vibe-trading:
    build:
      context: .
      args:
        VITE_BROWSER_API_URL: ${VITE_BROWSER_API_URL:-https://guangyingzhimeng.dpdns.org}
        VITE_BROWSER_API_PREFIX: ${VITE_BROWSER_API_PREFIX:-/vibe-trading}
    ports:
      - "8899:8899"
    env_file:
      - agent/.env
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
    restart: unless-stopped

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    env_file:
      - agent/.env
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
